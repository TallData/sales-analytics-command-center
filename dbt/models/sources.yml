version: 2

sources:
  - name: raw
    description: Validated synthetic monthly snapshots loaded by src.ingest.
    schema: raw
    tables:
      - name: provider_master
        columns:
          - name: provider_id
            tests: [not_null]
      - name: sales_rep_master
        columns:
          - name: sales_rep_id
            tests: [not_null]
      - name: applications
        description: Digital intake with provisional provider and rep attribution on approximately 50% of records; confirmed attribution comes from assignment events.
        columns:
          - name: application_id
            tests: [not_null]
      - name: application_assignment_events
        description: Illustrative synthetic allocation-attempt stream with three automated waterfall passes and a final current state.
        columns:
          - name: assignment_event_id
            tests: [not_null]
      - name: provider_location_reference
      - name: financed_sales
        columns:
          - name: transaction_id
            tests: [not_null]
      - name: provider_activity
      - name: sales_goals
      - name: pipeline
